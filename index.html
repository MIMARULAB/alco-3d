<title>ALCO İçərişəhər Ofisi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@500;600&family=Noto+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage; anthracite/ivory control surfaces float over it like window frames on ağlay stone */
:root{
  --logo-on-light:block; --logo-on-dark:none;
  --stage1:#EEE9E0; --stage2:#D8D0C2;
  --panel:rgba(250,247,242,.95); --panel-solid:#FAF7F2; --line:#DDD3C3; --ink:#24282C; --muted:#6C665D;
  --bronze:#86663B; --bronze-ink:#FFFFFF; --anth:#383E42; --chip:#F0E9DD; --green:#2F4A3C; --focus:#86663B;
  --shadow:0 10px 30px rgba(40,34,26,.14); --err:#B3261E; --warn:#7A5200; --rec:#A8322A;
  --f-display:"Noto Serif Display","Noto Serif",Georgia,serif;
  --f-body:"Noto Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --logo-on-light:none; --logo-on-dark:block;
  --stage1:#2B3033; --stage2:#16191B;
  --panel:rgba(31,35,38,.95); --panel-solid:#1F2326; --line:#3B4145; --ink:#ECE6DB; --muted:#A79F92;
  --bronze:#C9A06A; --bronze-ink:#1B1D1F; --anth:#C9CED1; --chip:#2A2F33; --green:#9CC3A8; --focus:#C9A06A;
  --shadow:0 10px 30px rgba(0,0,0,.45); --err:#F2B8B5; --warn:#E8C27A; --rec:#C9473D; color-scheme:dark; } }
:root[data-theme="dark"]{
  --logo-on-light:none; --logo-on-dark:block;
  --stage1:#2B3033; --stage2:#16191B;
  --panel:rgba(31,35,38,.95); --panel-solid:#1F2326; --line:#3B4145; --ink:#ECE6DB; --muted:#A79F92;
  --bronze:#C9A06A; --bronze-ink:#1B1D1F; --anth:#C9CED1; --chip:#2A2F33; --green:#9CC3A8; --focus:#C9A06A;
  --shadow:0 10px 30px rgba(0,0,0,.45); --err:#F2B8B5; --warn:#E8C27A; --rec:#C9473D; color-scheme:dark; }
html,body{height:100%}
body{margin:0;background:var(--stage2);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 10%,var(--stage1),var(--stage2))}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* brand */
.brand{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:14px 18px 13px;max-width:min(380px,calc(100vw - 32px))}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{height:24px;width:auto}
.logo.on-light{display:var(--logo-on-light)}
.logo.on-dark{display:var(--logo-on-dark)}
.loading .logo{height:34px;margin:0 auto 14px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);font-weight:600}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.08;margin:6px 0 4px;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
.lang{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;padding:3px;gap:2px;border-radius:999px}
.lang button{border:0;background:transparent;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--anth);color:var(--panel-solid)}

/* floor switcher */
.floors{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:4px;border-radius:999px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
.floors button{border:0;background:transparent;cursor:pointer;padding:9px 14px;border-radius:999px;white-space:nowrap;font-weight:500;color:var(--ink);display:flex;align-items:baseline;gap:6px}
.floors button small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.floors button[aria-pressed="true"]{background:var(--bronze);color:var(--bronze-ink)}
.floors button[aria-pressed="true"] small{color:inherit;opacity:.8}
.floors button:disabled{opacity:.42;cursor:not-allowed}

/* tools */
.tools{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:14px}
.tools button{border:0;background:transparent;width:40px;height:40px;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.tools button[aria-pressed="true"]{background:var(--chip);color:var(--bronze)}
.tools svg{width:20px;height:20px}

/* side panel */
.panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:360px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:9px 12px 10px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--bronze)}
.sheet-handle{display:none}
.pbody{overflow-y:auto;padding:14px 16px 18px;min-height:0;flex:1}
.floorhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 0 10px}
.floorhead h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0}
.floorhead span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lead{color:var(--muted);line-height:1.5;margin:0 0 14px}
.rooms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rooms button{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:10px;cursor:pointer}
.rooms button:hover{background:var(--chip)}
.rooms button[aria-current="true"]{background:var(--chip)}
.num{font-family:var(--f-mono);font-size:12px;width:30px;height:24px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:var(--bronze);font-weight:500}
.rooms .nm{font-weight:500;line-height:1.3;min-width:0}
.rooms .ar{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.detail h3{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.15;margin:8px 0 6px;text-wrap:balance}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.detail p{line-height:1.55;margin:0 0 14px}
.back{border:0;background:transparent;color:var(--bronze);cursor:pointer;padding:4px 0;font-weight:600;font-size:13px}
dl.fin{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0 0 16px;font-size:13px}
dl.fin dt{color:var(--muted);letter-spacing:.02em}
dl.fin dd{margin:0;line-height:1.4}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bronze);background:transparent;color:var(--bronze);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px}
.btn.solid{background:var(--bronze);color:var(--bronze-ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sw{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw i{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);display:block}
.sw b{display:block;font-weight:600;font-size:13.5px}
.sw span{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.note{font-size:12px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .6s;text-align:center;padding:0 16px}

/* 3D labels */
.lbl{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;font-weight:500;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.12);transition:background .2s,color .2s}
.lbl .n{font-family:var(--f-mono);font-size:11px;min-width:20px;height:20px;padding:0 4px;border-radius:999px;background:var(--anth);color:var(--panel-solid);display:grid;place-items:center}
.lbl.sel{background:var(--bronze);color:var(--bronze-ink);border-color:var(--bronze)}
.lbl.sel .n{background:var(--bronze-ink);color:var(--bronze)}
.lbl .t{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.nolabels .lbl{display:none}

.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--stage2);z-index:5;transition:opacity .5s}
.loading div{text-align:center}
.loading b{font-family:var(--f-display);font-size:22px;font-weight:600;display:block;margin-bottom:6px}
.loading span{color:var(--muted)}
.loading.done{opacity:0;pointer-events:none}


/* owner editor */
.mic{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:15px 16px;background:var(--bronze);color:var(--bronze-ink);font-weight:600;font-size:15px;cursor:pointer;margin:2px 0 4px}
.mic svg{width:22px;height:22px;flex:none}
.mic.rec{background:var(--rec);color:#fff;animation:recpulse 1.4s ease-in-out infinite}
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.swd{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:6px}
.sw b small.chg{font-weight:500;color:var(--bronze);font-size:11.5px}
.mic:disabled{opacity:.45;cursor:default}
@keyframes recpulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--rec) 25%,transparent)}}
textarea.ed{display:block;width:100%;box-sizing:border-box;min-height:92px;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--panel-solid);color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;resize:vertical;line-height:1.45}
textarea.ed:focus-visible,.pinrow input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.btn:disabled{opacity:.45;cursor:default}
.status{font-size:12.5px;color:var(--muted);min-height:18px;margin:4px 0 2px;line-height:1.45}
.status.err{color:var(--err)}
.reply{border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;margin:10px 0 14px;background:var(--chip)}
.reply p{margin:0 0 8px;line-height:1.5}
.reply .muted{color:var(--muted);font-size:12.5px}
.reply .warn{font-size:12.5px;line-height:1.45;color:var(--warn);margin:0 0 8px}
.reply details{font-size:12px;color:var(--muted)}
.reply summary{cursor:pointer}
.reply ul{margin:6px 0 0;padding-left:16px;line-height:1.5;font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere}
.reply li.rej{color:var(--err)}
h3.sub{font-family:var(--f-display);font-weight:600;font-size:16px;margin:16px 0 4px}
.vers{list-style:none;margin:0 0 10px;padding:0}
.vers li{border-top:1px solid var(--line);padding:8px 0}
.vers li[aria-current="true"] b{color:var(--bronze)}
.vers .vh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.vers .vh b{font-weight:600}
.vers time{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.vers p{margin:3px 0 2px;font-size:12.5px;color:var(--muted);line-height:1.4;overflow-wrap:anywhere}
.vers .back{font-size:12px;padding:2px 0}
.pinrow{display:flex;gap:8px;margin:6px 0 4px}
.pinrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--panel-solid);color:var(--ink);font:inherit;letter-spacing:.18em}

@media (max-width:760px){
  .panel.editing{max-height:62vh;max-height:min(62vh,calc(100svh - 216px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}
  textarea.ed,.pinrow input{font-size:16px}
  .logo{height:16px}
  .brand .eyebrow{display:none}
  .brandrow{flex-wrap:nowrap}
  .brand{padding:10px 14px;right:auto;box-sizing:border-box;max-width:calc(100vw - 132px)}
  .brand h1{font-size:20px}
  .brand p{display:none}
  .panel{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:auto;width:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-height:44vh;transition:max-height .3s}
  .panel.collapsed{max-height:52px}
  .sheet-handle{display:block;border:0;background:transparent;width:100%;padding:8px 0 0;cursor:pointer}
  .sheet-handle i{display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto}
  .tools{flex-direction:row;bottom:auto;top:calc(94px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px))}
  .tools button{width:36px;height:36px}
  .floors{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .floors button{padding:8px 11px}
  .floors button small{display:none}
  .hint{display:none}
  .lbl .t{display:none}
  .lbl{padding:3px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>

/* ------------------------------------------------------------------ utilities */
let seed = 7;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a,b) => a + (b-a)*rnd();

function ctex(w, h, draw, {srgb=true, rep=null}={}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (rep) t.repeat.set(rep[0], rep[1]);
  return t;
}
function speckle(g, W, H, n, col, a0, a1, s0=1, s1=2.5) {
  for (let i=0;i<n;i++){ g.fillStyle = `rgba(${col},${rr(a0,a1)})`; const s=rr(s0,s1); g.fillRect(rnd()*W, rnd()*H, s, s); }
}

const fitK=()=>{ const a=stage.clientWidth/Math.max(1,stage.clientHeight); return a<1.3?Math.min(2.4,1.4/a):1; };

  if (state.plan) return fitV({ p:W2(16.2,lv+36,12.6), t:W2(16.2,lv,12.4) });

function applyVisibility(){
  const f=state.floor, idx=ORDER.indexOf(f);

    const G=FL[k], i=ORDER.indexOf(k);

    G.root.visible=visible;
    const active = (k===f);
    const showInterior = active || (f==='B' && k==='M');
    G.furn.visible=showInterior; G.hi.visible=showInterior && !state.cut;
    G.labels.visible=active && state.labels;
    G.full.visible = !(active && state.cut); G.cut.visible = active && state.cut;
    G.win.visible = !(active && state.cut);
    G.stair.visible = active || f==='B' ? true : true;
    G.ceil.visible = true;

async function addPhotos(list){

  ED.err=''; ED.note=''; if (!take.length){ ED.err=e.phMax; renderEdit(); announce(ED.err); return; }
  const gen=ED.phGen; ED.phWork+=take.length; photosRefresh(); announce(e.phWork);
  let err=files.length>take.length?e.phMax:'';
  for (const f of take){ // one at a time: keeps phone memory low
    try { const p=await prepPhoto(f); if (gen!==ED.phGen){ URL.revokeObjectURL(p.url); } else { if (ED.photos.reduce((a,q)=>a+q.bytes,0)+p.bytes>PH_TOTAL){ URL.revokeObjectURL(p.url); throw new PhotoError('big'); } ED.photos.push(p); } }

function wirePhotos(){ const b=document.getElementById('ed-photo'); if (b) b.addEventListener('click',pickPhotos); $('#pbody').querySelectorAll('[data-ph]').forEach(x=>x.addEventListener('click',()=>removePhoto(+x.dataset.ph))); }
function removePhoto(id){

}
function clipFiles(dt, imagesOnly){ if (!dt) return []; const f=[...(dt.files||[])]; return (f.length?f:[...(dt.items||[])].filter(i=>i.kind==='file').map(i=>i.getAsFile())).filter(x=>x && (!imagesOnly || /^image\//.test(x.type||''))); }
function photosHtml(){

const PH_CSS=`.phs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.phs .ph-n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

.ph-x{position:absolute;top:3px;right:3px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:rgba(20,20,20,.68);color:#fff;font-size:17px;line-height:26px;text-align:center;cursor:pointer}

.panel.ph-drop{outline:2px dashed var(--bronze);outline-offset:-6px}
.vers .phc{font-weight:500;color:var(--muted)}`;
function keepTranscript(){ // forget the voice transcript once the owner has rewritten most of it by hand
  if (!ED.transcript) return; if (!ED.text.trim()){ ED.transcript=''; return; }
  const words=ED.transcript.toLowerCase().split(/\s+/).filter(Boolean), have=new Set(ED.text.toLowerCase().split(/\s+/));

}
const mmss=(s)=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function statusText(){
  const e=T[LANG].ed, s=Math.floor((performance.now()-ED.t0)/1000);

  if (ED.busy==='stt') return e.stt; if (ED.busy==='edit') return `${e.thinking} · ${mmss(s)}. ${e.keepOpen}`; if (ED.busy==='restore') return e.restoring; if (ED.busy==='verify') return e.verifying;
  if (ED.phWork) return e.phWork; return ED.note||'';
}
function tick(on){ clearInterval(ED.ticker); ED.ticker=null; if (on) ED.ticker=setInterval(()=>{ const el=document.getElementById('ed-status'); if (el && !ED.err) el.textContent=statusText(); },500); }
const MIC=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>`;
function fmtTime(s){ if (!s) return ''; const d=new Date(/[TZ]/.test(s)?s:String(s).replace(' ','T')+'Z'); if (isNaN(d)) return String(s);
  const p2=(n)=>String(n).padStart(2,'0'); return `${p2(d.getDate())}.${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`; }

    ((ap.length||rj.length)?`<details><summary>${esc(e.details)} · ${ap.length} ✓${rj.length?` · ${rj.length} ✗`:''}</summary><ul>${ap.map(a=>`<li>${esc(a.text||a.op||'')}</li>`).join('')}${rj.map(x=>`<li class="rej">✗ ${esc((x.op&&x.op.op)||'')} — ${esc(x.reason||'')}</li>`).join('')}</ul></details>`:'')+`</div>`;
}
function versionsHtml(){

function headHtml(){ const e=T[LANG].ed; return `<h2>${esc(e.title)}</h2>${VERSION!=null?`<span>v${esc(VERSION)}</span>`:''}`; }

function focusId(id){ const el=document.getElementById(id); if (el) el.focus({preventScroll:true}); }

function wireHistory(){ $('#pbody').querySelectorAll('[data-restore]').forEach(b=>b.addEventListener('click',()=>restoreTo(+b.dataset.restore,'pick'))); }

}
function startEditing(){

  document.getElementById('tab-edit').hidden=false;

/* ------------------------------------------------------------------ boot */
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); gfxSize(); labelR.setSize(w,h); camera.aspect=w/h;
  const pw = w>760 ? Math.min(392, w*.3) : 0; camera.aspect=(w+pw)/h; if (pw) camera.setViewOffset(w+pw,h,pw,0,w,h); else camera.clearViewOffset(); camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize);
function loop(now){
  requestAnimationFrame(loop);
  if (anim){ const k=Math.min(1,(now-anim.start)/anim.dur), e=ease(k); camera.position.lerpVectors(anim.p0,anim.p1,e); controls.target.lerpVectors(anim.t0,anim.t1,e); if (k>=1) anim=null; }
  controls.update(); if (gfxFrame(now)) labelR.render(scene,camera);
  if (!loop.done&&GF.shown){ loop.done=true; requestAnimationFrame(()=>$('#loading').classList.add('done')); }
}
function boot(){
  resize(); applyI18n();
  setTimeout(()=>{
    try {
      makeTextures(); makeMaterials();
      for (const r of (window.__PLAN__||{}).rooms||[]) (PLANROOMS[r.f]||(PLANROOMS[r.f]=[])).push(r);
      setRooms(STATE.rooms); applyMaterials(STATE.materials);

      buildMansard(); buildExterior(); buildLabels();
      sun.target.position.set(0,0,0);
      let start='B'; const h=(location.hash||'').slice(1); if (['Z','I','II','III','M'].includes(h)) start=h;
      const v0=floorView('B'); camera.position.copy(v0.p.clone().add(new THREE.Vector3(10,6,10))); controls.target.copy(v0.t);
      state.floor=start; applyVisibility(); applyI18n();
      const v=floorView(start); flyTo(v.p,v.t,1600);
      requestAnimationFrame(loop);
      startEditing();
      if (/[?&]debug\b/.test(location.search)) window.__alco={ camera, scene, renderer, get state(){ return STATE; }, get version(){ return VERSION; }, setDesignState,
        project:(x,z,y=0)=>{ const v=W2(x,y,z).project(camera); return [Math.round((v.x+1)/2*stage.clientWidth), Math.round((1-v.y)/2*stage.clientHeight)]; } };
    } catch(err){ console.error(err); $('#loading span').textContent='Error: '+err.message; }
  },30);
}
boot();
